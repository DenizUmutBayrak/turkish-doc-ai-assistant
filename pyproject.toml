[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-doc-ai-assistant"
version = "0.1.0"
description = "Türkçe PDF belgeleri için kaynak gösteren AI asistanı"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.3,<6",
]
web = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.20,<1",
    "starlette>=0.46,<1",
    "streamlit>=1.41,<2",
    "uvicorn[standard]>=0.34,<1",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests requiring the optional local embedding model and its download",
    "ollama_integration: tests requiring an explicitly enabled, running local Ollama model",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
